<!DOCTYPE html>
<html>

<head>

<title>Student Task Manager</title>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet" href="style.css">

</head>

<body>

<div class="container">

<h1>Student Task Manager</h1>

<div class="taskInputSection">

<input type="text" id="taskInput" placeholder="Enter Task">

<input type="date" id="taskDate">

<select id="taskStatus">
<option value="Assigned">Assigned</option>
<option value="In Progress">In Progress</option>
<option value="Completed">Completed</option>
</select>

<button onclick="addTask()">Add Task</button>

<!DOCTYPE html>
<html>
<head>

<title>Smart Task Manager</title>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet" href="style.css">

</head>

<body>

<div class="container">

<h1>🚀 Smart Task Manager</h1>

<div class="taskInput">

<input type="text" id="taskInput" placeholder="Enter task">

<input type="date" id="taskDate">

<select id="taskPriority">
<option value="Low">Low Priority</option>
<option value="Medium">Medium Priority</option>
<option value="High">High Priority</option>
</select>

<button onclick="addTask()">Add Task</button>

</div>

<div class="searchBox">

<input type="text" id="searchTask" placeholder="Search task..." onkeyup="searchTask()">

</div>

<div class="stats">

<div>Total Tasks: <span id="totalTasks">0</span></div>

<div>Completed: <span id="completedTasks">0</span></div>

</div>

<div class="progressContainer">
<div class="progressBar" id="progressBar"></div>
</div>

<div class="boards">

<div class="column">

<h2>Assigned</h2>

<ul id="assignedList"></ul>

</div>

<div class="column">

<h2>In Progress</h2>

<ul id="progressList"></ul>

</div>

<div class="column">

<h2>Completed</h2>

<ul id="completedList"></ul>

</div>

</div>

</div>

<script src="script.js"></script>

</body>
</html>
